name: Package Blender Extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate suite sources and manifest
        run: |
          python -c "import ast, pathlib, tomllib; files=['iyan_kim_tools/__init__.py','iyan_kim_tools/config.py','iyan_kim_tools/mochi_bone_cleaner.py','iyan_kim_tools/mesh_cleanup.py','iyan_kim_tools/uv_validation.py','scripts/package_addon.py']; [ast.parse(pathlib.Path(f).read_text(encoding='utf-8')) for f in files]; manifest=tomllib.loads(pathlib.Path('iyan_kim_tools/blender_manifest.toml').read_text(encoding='utf-8')); required=('schema_version','id','version','name','tagline','maintainer','type','blender_version_min','license'); missing=[field for field in required if not manifest.get(field)]; assert not missing, missing; assert manifest['type'] == 'add-on'; assert 'bl_info' not in pathlib.Path('iyan_kim_tools/__init__.py').read_text(encoding='utf-8')"

      - name: Build installable extension ZIP
        id: build
        run: |
          zip_path="$(python scripts/package_addon.py)"
          echo "zip_path=${zip_path}" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error

      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Iyan-Kim Tools ${{ github.ref_name }}
          files: ${{ steps.build.outputs.zip_path }}
